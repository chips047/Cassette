name: Build Cassette Cross-Platform

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason'
        required: false
        default: 'Manual Building'
      python_version:
        description: 'Python version'
        required: true
        type: choice
        default: '3.13'
        options:
          - '3.10'
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'
      upload_to_draft_release:
        description: 'Upload build artifacts to draft release'
        required: false
        type: boolean
        default: false

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-22.04
            artifact_name: linux-x64
            sep: ":"

          - os: ubuntu-24.04-arm
            artifact_name: linux-arm64
            sep: ":"

          - os: windows-latest
            artifact_name: windows-x64

          - os: windows-11-arm
            artifact_name: windows-arm64

          - os: macos-15-intel
            artifact_name: macos-intel

          - os: macos-latest
            artifact_name: macos-silicon

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}
          cache: 'pip'

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install wheel setuptools numpy pythran

      - name: Clone and build aubio
        run: |
          git clone https://github.com/aubio/aubio.git
          cd aubio
          python setup.py bdist_wheel
          cd ..

      - name: Setup Venv and Install Project
        shell: bash
        run: |
          python -m venv venv
          if [ "${{ runner.os }}" == "Windows" ]; then
            source venv/Scripts/activate
          else
            source venv/bin/activate
          fi

          pip install PyQt6
          pip install aubio/dist/*.whl
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Compile Pythran Modules
        shell: bash
        env:
          PYTHONUTF8: 1
        run: |
          if [ "${{ runner.os }}" == "Windows" ]; then
            source venv/Scripts/activate
            PYTHRAN_EXT=".pyd";
          else
            source venv/bin/activate
            PYTHRAN_EXT=".so";
          fi

          for file in System/Accelerated/*.py; do
            if grep -q "pythran export" "$file"; then
              FILENAME=$(basename "$file" .py)
              DIR_NAME=$(dirname "$file")

              pythran "$file" -o "$DIR_NAME/$FILENAME$PYTHRAN_EXT"
            fi
          done

      - name: Cleanup unnecessary files
        shell: bash
        run: |
          all_targets="linux-x64 linux-arm64 windows-x64 windows-arm64 macos-intel macos-silicon"

          for target in $all_targets; do
            if [ "$target" != "${{ matrix.artifact_name }}" ]; then
              rm -f "System/ADB/adb-$target" "System/ADB/adb-$target.exe"
              rm -f "System/FFmpeg/ffmpeg-$target" "System/FFmpeg/ffmpeg-$target.exe"
              rm -f "System/FFmpeg/ffprobe-$target" "System/FFmpeg/ffprobe-$target.exe"
            fi
          done

          if [ "${{ runner.os }}" != "Windows" ]; then
            rm -f System/ADB/AdbWinApi.dll
            rm -f System/ADB/AdbWinUsbApi.dll
          fi

          rm -f System/ADB/CassetteReceiver.apk

      - name: Run PyInstaller
        shell: bash
        run: |
          if [ "${{ runner.os }}" == "Windows" ]; then
            source venv/Scripts/activate
          else
            source venv/bin/activate
          fi

          pyinstaller --noconfirm cassette.spec

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cassette-${{ matrix.artifact_name }}
          path: dist/Cassette
          include-hidden-files: true

  publish-draft-release:
    name: Publish draft release
    needs: build
    if: ${{ inputs.upload_to_draft_release == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: |
          version_value=$(cat version | tr -d '[:space:]')
          echo "value=$version_value" >> "$GITHUB_OUTPUT"

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: cassette-*
          path: release-assets

      - name: List downloaded assets
        shell: bash
        run: ls -lhR release-assets

      - name: Install zip
        run: sudo apt-get update && sudo apt-get install -y zip
      
      - name: Restore executable permissions
        shell: bash
        run: |
          for dir in release-assets/*/; do
            name=$(basename "$dir")
            case "$name" in
              *linux*|*macos*)
                find "$dir" -type f ! -name "*.*" -exec chmod +x {} \;
                ;;
            esac
          done

      - name: Zip each platform build
        shell: bash
        run: |
          mkdir -p release-zips
          for dir in release-assets/*/; do
            name=$(basename "$dir")
            (cd "$dir" && zip -r -y "../../release-zips/${name}.zip" .)
          done
          ls -lh release-zips

      - name: Create or update draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: Cassette v${{ steps.version.outputs.value }}
          draft: true
          files: release-zips/*